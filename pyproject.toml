[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "when2ask"
version = "0.1.0"
description = "Clarification timing in a real PyBullet Panda pack-and-cover MVP"
requires-python = ">=3.11,<3.13"
dependencies = ["pybullet==3.2.7", "numpy==2.4.6", "pillow==13.0.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
