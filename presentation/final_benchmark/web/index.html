<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>When2Ask · Retrieve & Restore</title>
<link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#F7F9FC;color:#243F56}#canvas{width:1280px;height:720px;background:#F7F9FC;padding:27px 30px}header{display:flex;align-items:center;justify-content:space-between;height:57px;border-bottom:2px solid #CCD9E5}h1{font-size:28px;margin:0;color:#163650}#stage{font-size:22px;font-weight:bold;color:#1975BC}.layout{display:grid;grid-template-columns:790px 404px;gap:25px;margin-top:20px}.robot{height:555px;background:#fff;position:relative;border:1px solid #CCD9E5}#robot{display:block;width:100%;height:508px;object-fit:contain;background:#fafafa}#action{height:45px;padding:8px 17px;background:#E9F2FA;font-size:23px;font-weight:bold;color:#163650}#round{font-size:17px;color:#617589}#score{font-size:35px;margin:12px 0 14px;font-weight:bold;color:#1975BC}.flow{display:grid;grid-template-columns:1fr 1fr;gap:7px}.node{background:#EBF0F5;color:#7F90A0;font-size:20px;padding:13px 8px;text-align:center;border:2px solid transparent}.node.active{border-color:#1975BC;color:#163650;background:#DCECF9}.node.ask{border-color:#C66B19;color:#A2550C;background:#FFF0DF}.node.success{border-color:#218565;background:#E3F3EB;color:#218565}.wide{grid-column:span 2}#message{font-size:22px;line-height:1.3;margin-top:18px;min-height:90px}#answer{font-size:23px;color:#218565;font-weight:bold;min-height:40px;margin-top:10px}#note{font-size:17px;color:#617589;line-height:1.3;margin-top:12px}footer{display:flex;justify-content:space-between;color:#617589;font-size:17px;margin-top:15px}#controls{padding:8px 30px;width:1280px;display:flex;gap:14px;align-items:center}button,select{font:18px Arial;padding:6px 14px}input{width:700px}body.export #controls{display:none}
</style></head><body><main id="canvas"><header><h1>When2Ask · Retrieve & Restore</h1><span id="stage"></span></header><div class="layout"><section class="robot"><canvas id="robot" width="640" height="480" aria-label="Actual recorded PyBullet Panda execution"></canvas><div id="action"></div></section><section><div id="round"></div><div id="score"></div><div class="flow"><div id="n-gate" class="node wide">Clarification Gate</div><div id="n-question" class="node">Question</div><div id="n-planner" class="node">Action Planner</div><div id="n-user" class="node">User Answer</div><div id="n-physics" class="node">PyBullet Skills</div><div id="n-eval" class="node wide">DONE → Evaluator</div></div><div id="message"></div><div id="answer"></div><div id="note"></div></section></div><footer><span id="step"></span><span>Frame-synchronized replay</span></footer></main><div id="controls"><button id="play">Play</button><button id="restart">Restart</button><input id="seek" type="range" min="0" step="1"><select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option></select></div>
<script type="module">
const timeline=await(await fetch('timeline.json')).json();const fs=timeline.frames;const $=id=>document.getElementById(id);let current=0,clock=0,playing=false,last=0,requestId=0;
const names={storage_lid:'Storage lid',lid_pad:'Lid pad',stored_block:'Block',stored_cup:'Cup',delivery_pad:'Delivery pad',box:'Box'};
const title={decision:'CONTINUE',execution:'CONTINUE · Execute',question:'ASK · Clarify',answer:'ASK · User Answer',rejection:'CONTINUE · Skill Rejected',evaluation:'SUCCESS'};
async function showFrame(i){i=Math.max(0,Math.min(fs.length-1,i));const f=fs[i];const token=++requestId;const loaded=new Image();loaded.src=f.image.path;await loaded.decode();if(token!==requestId)return null;current=i;const img=$('robot');img.getContext('2d').drawImage(loaded,f.image.x,f.image.y,640,480,0,0,640,480);img.dataset.source=f.image.path;img.dataset.frame=String(i);
 document.querySelectorAll('.node').forEach(n=>n.className='node'+(['n-gate','n-eval'].includes(n.id)?' wide':''));
 const active=(id,c='active')=>$(id).classList.add(c);active('n-gate',['question','answer'].includes(f.stage)?'ask':f.stage==='evaluation'?'success':'active');
 if(f.stage==='question')active('n-question','ask');if(f.stage==='answer'){active('n-question','ask');active('n-user','ask');}if(['execution','rejection','decision'].includes(f.stage)){active('n-planner');if(f.stage!=='decision')active('n-physics');}if(f.stage==='evaluation')active('n-eval','success');
 $('stage').textContent=title[f.stage];$('stage').style.color=['question','answer','rejection'].includes(f.stage)?'#C66B19':f.stage==='evaluation'?'#218565':'#1975BC';$('round').textContent=`Round ${f.round} · Jev Gate`;$('score').textContent=`p(ASK) = ${f.gate.p_ask.toFixed(2)}`;$('score').style.color=f.gate.decision==='ASK'?'#C66B19':'#1975BC';
 const a=f.action;$('action').textContent=f.stage==='evaluation'?'Task complete · robot released':f.stage==='question'?'Robot paused · waiting for preference':f.stage==='answer'?'Robot paused · preference received':a?`${a.kind==='cover'?'Cover':a.kind==='move'?'Move':a.kind} ${names[a.object_id]||''}${a.target_id?' → '+(names[a.target_id]||a.target_id):''}${f.phase?' · '+f.phase:''}`:'';
 $('message').textContent=f.question?f.question.text:f.stage==='rejection'?'Generic lid move rejected. The next action uses the cover skill.':f.stage==='evaluation'?'Independent evaluation: all physical conditions passed.':f.action?.kind==='cover'?'Restore the lid after delivery.':f.round===0?'Opening is useful and already supported.':'Deliver the selected block.';
 $('answer').textContent=f.answer?'User: retrieve the block.':'';$('note').textContent=f.repaired_rejection?'The rejected command is preserved; a real cover action repairs it.':f.stage==='evaluation'?'Success is based on geometry, support, release and required order.':['question','answer'].includes(f.stage)?'Question and answer share the same physics step.':'Only public information is used for decisions.';
 $('step').textContent=`Frame ${i+1} / ${fs.length} · Simulation step ${f.simulation_step}`;$('seek').value=f.start_ms;
 return {frame_index:i,simulation_step:f.simulation_step,round:f.round,stage:f.stage,gate:f.gate,action:f.action,image:img.dataset.source,active:[...document.querySelectorAll('.active,.ask,.success')].map(n=>n.id)};
}
async function seek(ms){clock=Math.max(0,Math.min(timeline.duration_ms-0.01,ms));let i=fs.findIndex(f=>clock>=f.start_ms&&clock<f.end_ms);return showFrame(i<0?fs.length-1:i);}
function pause(){playing=false;$('play').textContent='Play';}function play(){if(clock>=timeline.duration_ms-1)clock=0;playing=true;last=performance.now();$('play').textContent='Pause';requestAnimationFrame(tick);}async function tick(now){if(!playing)return;clock+=(now-last)*Number($('speed').value);last=now;if(clock>=timeline.duration_ms){await showFrame(fs.length-1);pause();return;}const i=fs.findIndex(f=>clock>=f.start_ms&&clock<f.end_ms);if(i!==current)await showFrame(i);if(playing)requestAnimationFrame(tick);}
window.replay={timeline,showFrame,seek,pause,play,getState:()=>({frame:current,clock,playing})};$('seek').max=timeline.duration_ms-1;$('play').onclick=()=>playing?pause():play();$('restart').onclick=async()=>{pause();await seek(0);};$('seek').oninput=async e=>{pause();await seek(Number(e.target.value));};if(new URLSearchParams(location.search).has('export'))document.body.classList.add('export');await showFrame(0);window.replayReady=true;
</script></body></html>
